name: Deploy Fishpro Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 30m
          script: |
            mkdir -p /var/www/fishpro
            cd /var/www/fishpro
            if [ ! -d "backend/.git" ]; then
              rm -rf backend
              git clone https://github.com/barengs/fco-b.git backend
            fi
            cd /var/www/fishpro/backend
            git pull origin main
            cd /var/www/fishpro
            touch .env
            if ! grep -q '^SECRET_KEY=.\+' .env || grep -q '^SECRET_KEY=django-insecure-' .env; then
              sed -i '/^SECRET_KEY=/d' .env
              echo "SECRET_KEY=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9_-')" >> .env
            fi
            cat > docker-compose.override.yml << 'EOF'
            services:
              backend:
                env_file:
                  - .env
            EOF
            docker compose up -d db_baru
            docker compose up -d --no-deps --build backend
            for i in {1..15}; do
              docker compose exec -T backend python -c "import socket; s = socket.socket(); s.connect(('db_baru', 5432)); s.close()" 2>/dev/null && break || sleep 2
            done
            docker compose exec -T backend python manage.py migrate
            docker compose exec -T backend python manage.py sync_user_roles
            docker compose exec -T backend python manage.py collectstatic --noinput